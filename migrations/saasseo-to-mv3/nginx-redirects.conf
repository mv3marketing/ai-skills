server {
    server_name saasseo.com www.saasseo.com;

    if ($saasseo_redirect != "") {
        return 301 $saasseo_redirect;
    }

    # Section fallbacks - keep users inside the matching MV3 hub
    location /glossary/   { return 301 https://www.mv3marketing.com/glossary/; }
    location /case-study/ { return 301 https://www.mv3marketing.com/case-studies/; }
    location /category/   { return 301 https://www.mv3marketing.com/blog/; }
    location /author/     { return 301 https://www.mv3marketing.com/about/; }

    # Everything else is a retired blog post -> the blog hub, not the
    # homepage, so Google does not treat the batch as soft 404s.
    return 301 https://www.mv3marketing.com/blog/;
}
